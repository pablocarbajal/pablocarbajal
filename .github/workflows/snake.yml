name: Refresh profile activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0969da&color_dots=#ebedf0,#d0e7fa,#90c8ed,#409bd3,#0969a8
            dist/github-contribution-grid-snake-dark.svg?color_snake=#79c0ff&color_dots=#1b2330,#153858,#1f6397,#3196d2,#79d6f2

      - name: Allow calendar assets in generated directory
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate contribution calendar
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.graphql(`query($login: String!) { user(login: $login) { repositories(first:100,ownerAffiliations:OWNER,privacy:PUBLIC) { nodes { languages(first:10,orderBy:{field:SIZE,direction:DESC}) { edges { size node { name color } } } } } contributionsCollection { totalCommitContributions totalPullRequestContributions totalPullRequestReviewContributions totalIssueContributions contributionCalendar { totalContributions weeks { contributionDays { contributionCount contributionLevel date weekday } } } } } }`, {login: context.repo.owner});
            const entries=result.user.repositories.nodes.flatMap(r=>r.languages.edges);
            const languageTotals=new Map();
            for(const e of entries){const old=languageTotals.get(e.node.name)||{name:e.node.name,color:e.node.color||'#79c0ff',size:0};old.size+=e.size;languageTotals.set(old.name,old);}
            const languages=[...languageTotals.values()].sort((a,b)=>b.size-a.size).slice(0,5);
            const sum=languages.reduce((s,l)=>s+l.size,0);
            const calendar = result.user.contributionsCollection.contributionCalendar;
            const fs = require('fs');
            fs.mkdirSync('dist', {recursive:true});
            const days = calendar.weeks.flatMap(w => w.contributionDays);
            const active = days.filter(d => d.contributionCount > 0).length;
            const recent = days.slice(-30).reduce((s,d) => s+d.contributionCount,0);
            const best = Math.max(0,...days.map(d => d.contributionCount));
            const levels = ['NONE','FIRST_QUARTILE','SECOND_QUARTILE','THIRD_QUARTILE','FOURTH_QUARTILE'];
            for (const dark of [true,false]) {
              const bg = dark ? '#0d1117' : '#ffffff';
              const panel = dark ? '#161b22' : '#f6f8fa';
              const border = dark ? '#30363d' : '#d0d7de';
              const fg = dark ? '#e6edf3' : '#1f2328';
              const muted = dark ? '#8b949e' : '#656d76';
              const accent = dark ? '#79c0ff' : '#0969da';
              const colors = dark ? ['#1b2330','#153858','#1f6397','#3196d2','#79d6f2'] : ['#ebedf0','#d0e7fa','#90c8ed','#409bd3','#0969a8'];
              let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-label="Contribution overview: ${calendar.totalContributions} contributions in the last year"><rect width="920" height="320" rx="12" fill="${bg}"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">`;
              const metrics = [[calendar.totalContributions,'CONTRIBUTIONS · LAST YEAR'],[recent,'CONTRIBUTIONS · LAST 30 DAYS'],[active,'ACTIVE DAYS · LAST YEAR'],[best,'MOST CONTRIBUTIONS IN A DAY']];
              metrics.forEach(([value,label],i) => {
                const x=16+i*224;
                svg += `<rect x="${x}" y="12" width="216" height="90" rx="8" fill="${panel}" stroke="${border}"/><text x="${x+16}" y="52" fill="${accent}" font-size="30" font-weight="650">${value.toLocaleString('en-US')}</text><text x="${x+16}" y="78" fill="${muted}" font-size="9" letter-spacing="0.3">${label}</text>`;
              });
              let lastMonth='';
              calendar.weeks.forEach((week,i) => {
                const month=new Date(week.contributionDays[0].date+'T00:00:00Z').toLocaleString('en-US',{month:'short',timeZone:'UTC'});
                if(month!==lastMonth && i<calendar.weeks.length-1){svg+=`<text x="${50+i*16}" y="132" fill="${muted}" font-size="10">${month}</text>`;lastMonth=month;}
                week.contributionDays.forEach(d => {
                  const level=Math.max(0,levels.indexOf(d.contributionLevel));
                  svg+=`<rect x="${50+i*16}" y="${146+d.weekday*16}" width="12" height="12" rx="3" fill="${colors[level]}"><title>${d.date}: ${d.contributionCount} contributions</title></rect>`;
                });
              });
              for(const [label,day] of [['Mon',1],['Wed',3],['Fri',5]])svg+=`<text x="16" y="${155+day*16}" fill="${muted}" font-size="10">${label}</text>`;
              svg+=`<text x="16" y="289" fill="${muted}" font-size="10">Last 12 months · Updated ${new Date().toISOString().slice(0,10)} UTC</text><text x="715" y="289" fill="${muted}" font-size="10">Less</text>`;
              colors.forEach((color,i)=>svg+=`<rect x="${746+i*16}" y="279" width="12" height="12" rx="3" fill="${color}"/>`);
              svg+=`<text x="834" y="289" fill="${muted}" font-size="10">More</text></g></svg>`;
              fs.writeFileSync(`dist/contributions${dark?'-dark':''}.svg`,svg);
              let city=`<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430"><rect width="920" height="430" rx="12" fill="${bg}"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="34" fill="${fg}" font-size="18" font-weight="600">A year of building</text><text x="24" y="58" fill="${muted}" font-size="12">${calendar.totalContributions} contributions · ${active} active days · Last 12 months</text>`;
              calendar.weeks.forEach((week,i)=>[...week.contributionDays].sort((a,b)=>b.weekday-a.weekday).forEach(d=>{
                const level=Math.max(0,levels.indexOf(d.contributionLevel));
                const h=d.contributionCount?7+Math.log2(1+d.contributionCount)*10:0;
                const x=42+i*13+d.weekday*18,y=192+i*3-d.weekday*10;
                if(h)city+=`<polygon points="${x},${y-h} ${x+12},${y+3-h} ${x+12},${y+3} ${x},${y}" fill="#075985"/><polygon points="${x+12},${y+3-h} ${x+29},${y-7-h} ${x+29},${y-7} ${x+12},${y+3}" fill="#0c4a6e"/>`;
                city+=`<polygon points="${x},${y-h} ${x+17},${y-10-h} ${x+29},${y-7-h} ${x+12},${y+3-h}" fill="${colors[level]}" stroke="${bg}" stroke-width="0.7"><title>${d.date}: ${d.contributionCount} contributions</title></polygon>`;
              }));
              city+=`<text x="24" y="398" fill="${muted}" font-size="11">One block per day. Height uses a logarithmic scale of contribution count.</text><text x="24" y="417" fill="${muted}" font-size="10">Real activity · Updated ${new Date().toISOString().slice(0,10)} UTC</text></g></svg>`;
              city=city.replace('height="430" viewBox="0 0 920 430"','height="710" viewBox="0 0 920 710"').replace('<rect width="920" height="430"','<rect width="920" height="710"');
              let panel=`<line x1="24" y1="440" x2="896" y2="440" stroke="${border}"/><text x="24" y="475" fill="${fg}" font-size="17" font-weight="600">Languages</text><text x="24" y="496" fill="${muted}" font-size="10">Public repository bytes · includes forks</text>`;
              const circumference=2*Math.PI*64;
              panel+=`<circle cx="108" cy="593" r="64" fill="none" stroke="${panel === '' ? bg : border}" stroke-width="24"/>`;
              let offset=0;
              languages.forEach((l,i)=>{const pct=l.size/sum,len=pct*circumference;
                panel+=`<circle cx="108" cy="593" r="64" fill="none" stroke="${l.color}" stroke-width="24" stroke-dasharray="${len} ${circumference-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 108 593)"/><rect x="210" y="${536+i*28}" width="11" height="11" rx="3" fill="${l.color}"/><text x="232" y="${546+i*28}" fill="${fg}" font-size="12">${l.name} · ${(pct*100).toFixed(1)}%</text>`;offset+=len;});
              if(!sum)panel+=`<text x="24" y="548" fill="${muted}" font-size="12">No public language data available</text>`;
              panel+=`<line x1="440" y1="466" x2="440" y2="684" stroke="${border}"/><text x="475" y="475" fill="${fg}" font-size="17" font-weight="600">Activity breakdown</text><text x="475" y="496" fill="${muted}" font-size="10">Last 12 months · activity visible to GitHub Actions</text>`;
              const cc=result.user.contributionsCollection;
              const breakdown=[['Commits',cc.totalCommitContributions],['Pull requests',cc.totalPullRequestContributions],['Reviews',cc.totalPullRequestReviewContributions],['Issues',cc.totalIssueContributions]];
              const max=Math.max(1,...breakdown.map(x=>x[1]));
              breakdown.forEach(([label,value],i)=>{const y=531+i*42;panel+=`<text x="475" y="${y}" fill="${fg}" font-size="12">${label}</text><text x="872" y="${y}" text-anchor="end" fill="${accent}" font-size="13" font-weight="600">${value}</text><rect x="475" y="${y+8}" width="397" height="6" rx="3" fill="${border}"/>`;if(value)panel+=`<rect x="475" y="${y+8}" width="${397*value/max}" height="6" rx="3" fill="${accent}"/>`;});
              city=city.replace('</g></svg>',panel+'</g></svg>');

              fs.writeFileSync(`dist/contributions-3d-${dark?'dark':'light'}.svg`,city);
            }

      - name: Generate contribution space shooter
        uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/space-shooter.gif
          strategy: column
          fps: 25
          no-commit: 'true'

      - name: Publish animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
