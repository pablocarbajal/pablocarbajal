name: Refresh profile activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0969da&color_dots=#ebedf0,#d0e7fa,#90c8ed,#409bd3,#0969a8
            dist/github-contribution-grid-snake-dark.svg?color_snake=#79c0ff&color_dots=#1b2330,#153858,#1f6397,#3196d2,#79d6f2

      - name: Allow calendar assets in generated directory
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate contribution calendar
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.graphql(`query($login: String!) { user(login: $login) { repositories(first:100,ownerAffiliations:OWNER,privacy:PUBLIC) { nodes { languages(first:10,orderBy:{field:SIZE,direction:DESC}) { edges { size node { name color } } } } } contributionsCollection { totalCommitContributions totalPullRequestContributions totalPullRequestReviewContributions totalIssueContributions totalRepositoryContributions contributionCalendar { totalContributions weeks { contributionDays { contributionCount contributionLevel date weekday } } } } } }`, {login: context.repo.owner});
            const entries=result.user.repositories.nodes.flatMap(r=>r.languages.edges);
            const languageTotals=new Map();
            for(const e of entries){const old=languageTotals.get(e.node.name)||{name:e.node.name,color:e.node.color||'#79c0ff',size:0};old.size+=e.size;languageTotals.set(old.name,old);}
            const languages=[...languageTotals.values()].sort((a,b)=>b.size-a.size).slice(0,5);
            const sum=languages.reduce((s,l)=>s+l.size,0);
            const calendar = result.user.contributionsCollection.contributionCalendar;
            const fs = require('fs');
            fs.mkdirSync('dist', {recursive:true});
            const days = calendar.weeks.flatMap(w => w.contributionDays);
            const active = days.filter(d => d.contributionCount > 0).length;
            const recent = days.slice(-30).reduce((s,d) => s+d.contributionCount,0);
            const best = Math.max(0,...days.map(d => d.contributionCount));
            const levels = ['NONE','FIRST_QUARTILE','SECOND_QUARTILE','THIRD_QUARTILE','FOURTH_QUARTILE'];
            for (const dark of [true,false]) {
              const bg = dark ? '#0d1117' : '#ffffff';
              const panel = dark ? '#161b22' : '#f6f8fa';
              const border = dark ? '#30363d' : '#d0d7de';
              const fg = dark ? '#e6edf3' : '#1f2328';
              const muted = dark ? '#8b949e' : '#656d76';
              const accent = dark ? '#79c0ff' : '#0969da';
              const colors = dark ? ['#1b2330','#153858','#1f6397','#3196d2','#79d6f2'] : ['#ebedf0','#d0e7fa','#90c8ed','#409bd3','#0969a8'];
              let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-label="Contribution overview: ${calendar.totalContributions} contributions in the last year"><rect width="920" height="320" rx="12" fill="${bg}"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">`;
              const metrics = [[calendar.totalContributions,'CONTRIBUTIONS · LAST YEAR'],[recent,'CONTRIBUTIONS · LAST 30 DAYS'],[active,'ACTIVE DAYS · LAST YEAR'],[best,'MOST CONTRIBUTIONS IN A DAY']];
              metrics.forEach(([value,label],i) => {
                const x=16+i*224;
                svg += `<rect x="${x}" y="12" width="216" height="90" rx="8" fill="${panel}" stroke="${border}"/><text x="${x+16}" y="52" fill="${accent}" font-size="30" font-weight="650">${value.toLocaleString('en-US')}</text><text x="${x+16}" y="78" fill="${muted}" font-size="9" letter-spacing="0.3">${label}</text>`;
              });
              let lastMonth='';
              calendar.weeks.forEach((week,i) => {
                const month=new Date(week.contributionDays[0].date+'T00:00:00Z').toLocaleString('en-US',{month:'short',timeZone:'UTC'});
                if(month!==lastMonth && i<calendar.weeks.length-1){svg+=`<text x="${50+i*16}" y="132" fill="${muted}" font-size="10">${month}</text>`;lastMonth=month;}
                week.contributionDays.forEach(d => {
                  const level=Math.max(0,levels.indexOf(d.contributionLevel));
                  svg+=`<rect x="${50+i*16}" y="${146+d.weekday*16}" width="12" height="12" rx="3" fill="${colors[level]}"><title>${d.date}: ${d.contributionCount} contributions</title></rect>`;
                });
              });
              for(const [label,day] of [['Mon',1],['Wed',3],['Fri',5]])svg+=`<text x="16" y="${155+day*16}" fill="${muted}" font-size="10">${label}</text>`;
              svg+=`<text x="16" y="289" fill="${muted}" font-size="10">Last 12 months · Updated ${new Date().toISOString().slice(0,10)} UTC</text><text x="715" y="289" fill="${muted}" font-size="10">Less</text>`;
              colors.forEach((color,i)=>svg+=`<rect x="${746+i*16}" y="279" width="12" height="12" rx="3" fill="${color}"/>`);
              svg+=`<text x="834" y="289" fill="${muted}" font-size="10">More</text></g></svg>`;
              fs.writeFileSync(`dist/contributions${dark?'-dark':''}.svg`,svg);
              {
              const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
              const cc=result.user.contributionsCollection;
              let city=`<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590" role="img" aria-label="Contribution landscape with language distribution and five-axis activity radar"><rect width="920" height="590" rx="12" fill="${bg}"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="32" fill="${fg}" font-size="18" font-weight="600">Pablo Carbajal · Contribution landscape</text><text x="24" y="55" fill="${muted}" font-size="11">${calendar.totalContributions} contributions · ${active} active days · Last 12 months</text>`;
              calendar.weeks.forEach((week,i)=>[...week.contributionDays].sort((a,b)=>b.weekday-a.weekday).forEach(d=>{
                const level=Math.max(0,levels.indexOf(d.contributionLevel));
                const h=d.contributionCount?5+Math.log2(1+d.contributionCount)*9:0;
                const x=28+i*12.7+d.weekday*15,y=133+i*6-d.weekday*8;
                const hue=[285,320,100,62,35][Math.min(4,Math.floor(i/11))];
                const light=dark?32+level*10:67-level*7;
                const top=level?`hsl(${hue},65%,${light}%)`:(dark?'#232b36':'#e5e7eb');
                const left=`hsl(${hue},48%,${Math.max(15,light-17)}%)`,right=`hsl(${hue},42%,${Math.max(12,light-27)}%)`;
                if(h)city+=`<polygon points="${x},${y-h} ${x+12},${y+6-h} ${x+12},${y+6} ${x},${y}" fill="${left}"/><polygon points="${x+12},${y+6-h} ${x+26},${y-2-h} ${x+26},${y-2} ${x+12},${y+6}" fill="${right}"/>`;
                city+=`<polygon points="${x},${y-h} ${x+14},${y-8-h} ${x+26},${y-2-h} ${x+12},${y+6-h}" fill="${top}" stroke="${bg}" stroke-width="0.6"><title>${d.date}: ${d.contributionCount} contributions</title></polygon>`;
              }));
              city+=`<text x="685" y="84" fill="${fg}" font-size="14" font-weight="600">Activity profile</text>`;
              const metrics=[['Commits',cc.totalCommitContributions],['Issues',cc.totalIssueContributions],['Pull requests',cc.totalPullRequestContributions],['Reviews',cc.totalPullRequestReviewContributions],['Repos',cc.totalRepositoryContributions]];
              const cx=752,cy=196,radius=79;
              const point=(i,r)=>[cx+Math.cos(-Math.PI/2+i*2*Math.PI/5)*r,cy+Math.sin(-Math.PI/2+i*2*Math.PI/5)*r];
              for(let ring=1;ring<=4;ring++)city+=`<polygon points="${metrics.map((_,i)=>point(i,radius*ring/4).join(',')).join(' ')}" fill="none" stroke="${border}" stroke-dasharray="3 4"/>`;
              metrics.forEach(([label,value],i)=>{const p=point(i,radius),t=point(i,radius+28);city+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="${border}"/><text x="${t[0]}" y="${t[1]}" text-anchor="middle" fill="${fg}" font-size="10">${label}<tspan x="${t[0]}" dy="14" fill="${muted}">${value}</tspan></text>`;});
              const maxMetric=Math.max(1,...metrics.map(m=>m[1]));
              city+=`<polygon points="${metrics.map((m,i)=>point(i,radius*Math.log1p(m[1])/Math.log1p(maxMetric)).join(',')).join(' ')}" fill="#56d364" fill-opacity="0.35" stroke="#7ee787" stroke-width="2"/><text x="650" y="322" fill="${muted}" font-size="9">Last year · logarithmic axes</text>`;
              city+=`<text x="24" y="350" fill="${fg}" font-size="14" font-weight="600">Languages</text>`;
              const circumference=2*Math.PI*61;
              city+=`<circle cx="104" cy="435" r="61" fill="none" stroke="${border}" stroke-width="23"/>`;
              let offset=0;
              languages.forEach((l,i)=>{const pct=l.size/sum,len=pct*circumference;city+=`<circle cx="104" cy="435" r="61" fill="none" stroke="${l.color}" stroke-width="23" stroke-dasharray="${len} ${circumference-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 104 435)"/><rect x="195" y="${388+i*25}" width="10" height="10" rx="2" fill="${l.color}"/><text x="215" y="${398+i*25}" fill="${fg}" font-size="11">${esc(l.name)} · ${(pct*100).toFixed(1)}%</text>`;offset+=len;});
              city+=`<text x="24" y="528" fill="${muted}" font-size="10">Languages: public repository bytes, including forks. Radar: activity visible to GitHub Actions.</text><text x="24" y="549" fill="${muted}" font-size="10">Block color follows the time of year; height follows actual daily activity on a logarithmic scale.</text><text x="24" y="572" fill="${muted}" font-size="10">Updated ${new Date().toISOString().slice(0,10)} UTC · Refreshes every 6 hours</text></g></svg>`;
              fs.writeFileSync(`dist/contributions-3d-${dark?'dark':'light'}.svg`,city);
              }
            }

      - name: Generate contribution space shooter
        uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/space-shooter.gif
          strategy: column
          fps: 25
          no-commit: 'true'

      - name: Publish animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
